name: API CI

permissions:
  contents: read

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-26
    timeout-minutes: 10

    defaults:
      run:
        working-directory: rumbo-api

    steps:
      - name: Download code from repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Check lint
        run: npm run lint

      - name: Check types
        run: npx tsc --noEmit --incremental false

      - name: Run unit tests
        run: npm test

      - name: Build app
        run: npm run build
